# nginx site for King Kulbik on a VPS: HTTPS in front of the Node server.
# Installed by deploy/setup.sh as /etc/nginx/sites-available/kingkulbik with
# DOMAIN replaced; certbot then adds the HTTPS (443) part to this file.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Admin image uploads are up to ~4.3 MB of JSON
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        # The app builds sign-in redirects and secure cookies from these
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
